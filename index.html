<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATH ARENA - O Jogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #050508;
            --primary: #00f0ff;
            --secondary: #7000ff;
            --accent: #ff003c;
            --gold: #ffb800;
            --text-muted: #8a8a9d;
            --glass-bg: rgba(15, 15, 25, 0.7);
            --glass-border: rgba(0, 240, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-dark); 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(112, 0, 255, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.15), transparent 25%);
            color: white; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            overflow-x: hidden;
        }

        .main-content { 
            flex: 1; 
            overflow-y: auto !important; 
            padding: 20px 20px 120px 20px; 
            display: flex; 
            flex-direction: column; 
            -webkit-overflow-scrolling: touch; 
        }
        
        .screen { display: none; width: 100%; max-width: 500px; margin: 0 auto; animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .glass { background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        .text-gradient { background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.3)); }
        .text-center { text-align: center; } .mb-20 { margin-bottom: 20px; } .mb-15 { margin-bottom: 15px; }

        button { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 16px; cursor: pointer; transition: all 0.2s ease; border-radius: 12px; }
        button:active { transform: scale(0.95); }
        
        .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; box-shadow: 0 5px 15px rgba(0, 240, 255, 0.4), inset 0 2px 0 rgba(255,255,255,0.3); text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .btn-secondary { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        /* Avatar e Molduras */
        /* Avatar e Molduras */
.avatar-wrapper { 
    position: relative; width: 80px; height: 80px; 
    display: flex; justify-content: center; align-items: center; 
    margin-bottom: 10px; 
}
.avatar-img { 
    width: 46px; height: 46px; background: #1a1a2e; 
    border-radius: 50%; display: flex; justify-content: center; align-items: center; 
    font-size: 26px; z-index: 2; 
    border: 2px solid rgba(255,255,255,0.1);
    position: absolute; /* O segredo está aqui: ele fica no meio da imagem */
}

.frame { 
    position: absolute; width: 100%; height: 100%; 
    z-index: 1; pointer-events: none; 
    display: flex; justify-content: center; align-items: center; 
}
.frame img { width: 100%; height: 100%; object-fit: contain; }
.frame-padrao { border: 3px solid var(--primary); box-shadow: 0 0 15px var(--primary); border-radius: 50%; }
        @keyframes brilho-lendario { 0% { filter: drop-shadow(0 0 5px #ffb800); } 50% { filter: drop-shadow(0 0 20px #ffb800); } 100% { filter: drop-shadow(0 0 5px #ffb800); } }
        .brilho-legendario { animation: brilho-lendario 2s infinite; }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
        .float-anim { animation: float 3s ease-in-out infinite; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); display: none; justify-content: space-around; padding: 12px 0 20px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-muted); font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .nav-item .icon { font-size: 22px; }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); filter: drop-shadow(0 0 8px var(--primary)); }

        input { width: 100%; padding: 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; margin-bottom: 15px; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
        
        /* Toasts */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .toast { background: rgba(20, 25, 40, 0.95); border-left: 4px solid var(--primary); padding: 15px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; animation: slideDown 0.3s ease-out; }
        .toast.success { border-left-color: #00ff88; } .toast.error { border-left-color: #ff003c; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="main-content">
    <!-- TELA DE LOGIN -->
    <div id="tela-auth" class="screen active">
        <div class="glass auth-container">
            <h1 class="text-gradient text-center mb-20">MATH ARENA</h1>
            <p class="text-center" style="font-size: 14px; color: var(--text-muted); margin-bottom: 25px;">Faça login para continuar sua jornada.</p>
            <input type="email" id="auth-email" placeholder="Seu E-mail">
            <input type="password" id="auth-pass" placeholder="Sua Senha">
            <button class="btn-primary" onclick="fazerLogin()">ENTRAR</button>
            <button class="btn-secondary" style="margin-top: 10px;" onclick="fazerCadastro()">CRIAR CONTA</button>
        </div>
    </div>

    <!-- TELA INICIAL -->
    <div id="tela-home" class="screen">
        <div class="user-header" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
            <div class="user-info" style="display: flex; align-items: center; gap: 15px;">
                <div class="avatar-wrapper float-anim">
                    <div class="frame frame-padrao" id="home-frame"></div>
                    <div class="avatar-img" id="home-avatar">🐱</div>
                </div>
                <div>
                    <div class="user-name" id="home-nome" style="font-weight: 800; font-size: 18px;">Carregando...</div>
                    <div class="user-level" id="home-nivel" style="font-size: 12px; color: var(--gold); font-weight: 600;">Nível 1</div>
                </div>
            </div>
            <div class="header-stats" style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
                <div class="badge badge-fire" id="home-streak" style="background: rgba(255,69,0,0.15); border: 1px solid rgba(255,69,0,0.3); color: #ff4500; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold;">🔥 0</div>
                <div class="badge badge-coin" style="background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); color: var(--gold); padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold;">🪙 <span id="home-moedas">0</span></div>
            </div>
        </div>

        <div class="glass mb-20">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-size: 12px; font-weight: bold; color: var(--text-muted);">PROGRESSO</span>
                <span style="font-size: 12px; font-weight: bold; color: var(--primary);" id="home-xp-txt">0 / 100 XP</span>
            </div>
            <div style="width: 100%; height: 10px; background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden;">
                <div style="height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%;" id="home-xp-bar"></div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <button class="btn-primary" style="background: linear-gradient(135deg, #00f0ff, #7000ff);" onclick="mostrarToast('Em breve!', 'error')">
                <span style="font-size: 30px;">🎮</span><br>JOGAR
            </button>
            <button class="btn-secondary" style="background: linear-gradient(135deg, #ff9e0b, #dd7700); border: none; color: black;" onclick="mudarAba('tela-loja')">
                <span style="font-size: 30px;">🛒</span><br>LOJA
            </button>
        </div>
    </div>

    <!-- TELA LOJA -->
    <div id="tela-loja" class="screen">
        <h2 class="text-gradient text-center mb-20" style="font-size: 28px;">LOJA VIP</h2>
        <div class="text-center mb-20" style="font-weight: bold; color: var(--gold);">
            Suas moedas: 🪙 <span id="loja-moedas">0</span>
        </div>
        <div class="glass text-center mb-20">
            <p style="color: var(--text-muted); font-size: 14px;">A loja de itens está em construção. Ganhe molduras subindo de nível e mantendo a sequência!</p>
        </div>
        <button class="btn-secondary mt-20" onclick="mudarAba('tela-home')">VOLTAR</button>
    </div>

    <!-- TELA PERFIL -->
    <div id="tela-perfil" class="screen">
        <h2 class="text-gradient text-center mb-20" style="font-size: 28px;">PERFIL</h2>
        <div class="glass text-center mb-20">
            <div class="avatar-wrapper float-anim" style="margin: 0 auto 15px auto; width: 90px; height: 90px;">
                <div class="frame frame-padrao" id="perfil-frame"></div>
                <div class="avatar-img" id="perfil-avatar" style="width: 66px; height: 66px; font-size: 36px;">🐱</div>
            </div>
            <input type="text" id="perfil-nome-input" placeholder="Seu nome" oninput="salvarNomeDelay()" style="text-align: center; font-weight: bold; font-size: 18px; margin-bottom: 5px;">
        </div>
        
        <div class="glass mb-20">
            <h3 class="mb-15" style="font-size: 14px; color: var(--text-muted);">MOLDURAS DISPONÍVEIS</h3>
            <div id="seletor-molduras" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;"></div>
        </div>

        <button class="btn-secondary" style="background: rgba(255, 8, 68, 0.1); border-color: rgba(255,8,68,0.3); color: #ff0844;" onclick="sair()">SAIR DA CONTA</button>
        <button class="btn-secondary mt-20" onclick="mudarAba('tela-home')">VOLTAR</button>
    </div>
</div>

<!-- MENU INFERIOR -->
<nav id="bottom-nav" class="bottom-nav">
    <div class="nav-item" onclick="mudarAba('tela-home', this)"><div class="icon">🏠</div>Início</div>
    <div class="nav-item" onclick="mudarAba('tela-loja', this)"><div class="icon">🛒</div>Loja</div>
    <div class="nav-item" onclick="mudarAba('tela-perfil', this)"><div class="icon">👤</div>Perfil</div>
</nav>
<script>
    // CONEXÃO COM O SUPABASE
    const SUPABASE_URL = 'https://zhciurzkzmdenuapzugj.supabase.co';
    const SUPABASE_KEY = `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoY2l1cnprem1kZW51YXB6dWdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NzM0ODIsImV4cCI6MjEwOTA0OTQ4Mn0.bLdz-6jMEXuEFoX9T5DRfRvR1huDY5I-awnutjiQ2dc`;
    const banco = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let jogador = { 
        id: null, nome: 'Jogador', xp: 0, nivel: 1, moedas: 0, 
        avatar: '🐱', moldura_equipada: 'padrao', 
        molduras_desbloqueadas: ['padrao', '01', '02', '05', '20'] // Desbloqueado para teste
    };

    // BANCO DE DADOS DAS MOLDURAS (Mapeando as imagens que você subiu)
    const MOLDURAS_DB = [
        { id: 'padrao', nome: 'Iniciante', img: '', tipo: 'css', raridade: 'Comum' },
        { id: '01', nome: 'Folhas', img: 'moldura_01.png', tipo: 'img', raridade: 'Comum' },
        { id: '02', nome: 'Madeira', img: 'moldura_02.png', tipo: 'img', raridade: 'Comum' },
        { id: '05', nome: 'Neon Azul', img: 'moldura_05.png', tipo: 'img', raridade: 'Rara' },
        { id: '20', nome: 'Dragão de Fogo', img: 'moldura_20.png', tipo: 'img', raridade: 'Lendária', efeito: 'brilho-legendario' }
    ];

    function getNivel(xp) {
        if (xp >= 5000) return { nivel: 10, nome: 'Mestre', xpAtual: xp, xpProx: 10000 };
        if (xp >= 2500) return { nivel: 8, nome: 'Diamante', xpAtual: xp, xpProx: 5000 };
        if (xp >= 1000) return { nivel: 5, nome: 'Platina', xpAtual: xp, xpProx: 2500 };
        if (xp >= 300) return { nivel: 3, nome: 'Prata', xpAtual: xp, xpProx: 1000 };
        return { nivel: 1, nome: 'Bronze', xpAtual: xp, xpProx: 300 };
    }

    function mostrarToast(mensagem, tipo = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${tipo}`;
        const icone = tipo === 'success' ? '✅' : '❌';
        toast.innerHTML = `<span style="font-size: 20px;">${icone}</span><span>${mensagem}</span>`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    async function fazerCadastro() {
        const email = document.getElementById('auth-email').value.trim();
        const senha = document.getElementById('auth-pass').value;
        if (!email || !senha) { mostrarToast("Preencha e-mail e senha.", "error"); return; }
        const { error } = await banco.auth.signUp({ email, password: senha });
        if (error) { mostrarToast(error.message, "error"); } else { mostrarToast("Conta criada! Faça login.", "success"); }
    }

    async function fazerLogin() {
        const email = document.getElementById('auth-email').value.trim();
        const senha = document.getElementById('auth-pass').value;
        if (!email || !senha) { mostrarToast("Preencha e-mail e senha.", "error"); return; }
        const { data, error } = await banco.auth.signInWithPassword({ email, password: senha });
        if (error) { mostrarToast(error.message, "error"); } 
        else { 
            jogador.id = data.user.id; 
            document.getElementById('tela-auth').classList.remove('active');
            document.getElementById('bottom-nav').style.display = 'flex';
            mudarAba('tela-home');
        }
    }

    async function sair() {
        await banco.auth.signOut();
        location.reload();
    }

    async function carregarPerfil() {
        if (!jogador.id) return;
        const { data, error } = await banco.from('ranking').select('*').eq('user_id', jogador.id).maybeSingle();
        if (error) return;
        
        if (data) {
            jogador.nome = data.nome || 'Jogador';
            jogador.xp = data.xp || 0;
            jogador.moedas = data.moedas || 0;
            jogador.avatar = data.avatar || '🐱';
            jogador.moldura_equipada = data.moldura_equipada || 'padrao';
            jogador.molduras_desbloqueadas = data.molduras_compradas || ['padrao'];
        } else {
            await banco.from('ranking').insert([{ 
                user_id: jogador.id, nome: jogador.nome, xp: 0, moedas: 0, 
                avatar: '🐱', moldura_equipada: 'padrao', molduras_compradas: ['padrao', '01'] 
            }]);
        }
    }

    function renderizarMoldura(elementId, molduraId) {
        const el = document.getElementById(elementId);
        const moldura = MOLDURAS_DB.find(m => m.id === molduraId) || MOLDURAS_DB[0];
        
        if (moldura.tipo === 'css') {
            el.innerHTML = ''; 
            el.className = 'frame frame-padrao';
        } else {
            el.className = `frame ${moldura.efeito || ''}`;
            el.innerHTML = `<img src="${moldura.img}" alt="${moldura.nome}">`;
        }
    }

    async function atualizarDashboard() {
        if (!jogador.id) return;
        await carregarPerfil();
        
        document.getElementById('home-nome').innerText = jogador.nome;
        document.getElementById('home-avatar').innerText = jogador.avatar;
        document.getElementById('perfil-avatar').innerText = jogador.avatar;
        document.getElementById('perfil-nome-input').value = jogador.nome;
        document.getElementById('home-moedas').innerText = jogador.moedas;
        document.getElementById('loja-moedas').innerText = jogador.moedas;
        document.getElementById('home-streak').innerText = \🔥 ${jogador.streak || 0}\`;
        
        const infoNivel = getNivel(jogador.xp);
        jogador.nivel = infoNivel.nivel;
        
        document.getElementById('home-nivel').innerText = `Nível ${infoNivel.nivel} - ${infoNivel.nome}`;
        document.getElementById('home-xp-txt').innerText = `${infoNivel.xpAtual} / ${infoNivel.xpProx} XP`;
        document.getElementById('home-xp-bar').style.width = `${(infoNivel.xpAtual / infoNivel.xpProx) * 100}%`;
        
        renderizarMoldura('home-frame', jogador.moldura_equipada);
        renderizarMoldura('perfil-frame', jogador.moldura_equipada);
        renderizarSeletorMolduras();
    }

    function renderizarSeletorMolduras() {
        const container = document.getElementById('seletor-molduras');
        container.innerHTML = '';

        MOLDURAS_DB.forEach(moldura => {
            const temMoldura = jogador.molduras_desbloqueadas.includes(moldura.id) || moldura.id === 'padrao';
            
            const btn = document.createElement('div');
            btn.style.cssText = 'cursor: pointer; text-align: center; position: relative; padding: 5px;';
            
            let contentHTML = '';
            if (moldura.tipo === 'css') {
                contentHTML = `<div style="width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--primary); margin: 0 auto; display: flex; align-items: center; justify-content: center; background: #1a1a2e;">${jogador.avatar}</div>`;
            } else {
   contentHTML = `
    <div style="width: 50px; height: 50px; margin: 0 auto; position: relative; display: flex; justify-content: center; align-items: center;">
        <div style="position: absolute; font-size: 20px; z-index: 1;">${jogador.avatar}</div>
        <img src="${moldura.img}" style="width: 100%; height: 100%; position: absolute; z-index: 2;">
    </div>`;
            }

            if (!temMoldura) {
                btn.style.opacity = '0.3';
                contentHTML += `<div style="font-size: 20px; position: absolute; top: 15px; left: 15px; z-index: 3;">🔒</div>`;
            }

            if (jogador.moldura_equipada === moldura.id) {
                btn.style.transform = 'scale(1.1)';
                btn.style.filter = 'drop-shadow(0 0 8px var(--primary))';
            }

            btn.innerHTML = contentHTML;
            
            if (temMoldura) {
                btn.onclick = async () => {
                    jogador.moldura_equipada = moldura.id;
                    await banco.from('ranking').update({ moldura_equipada: moldura.id }).eq('user_id', jogador.id);
                    mostrarToast(`Moldura ${moldura.nome} equipada!`);
                    atualizarDashboard();
                };
            }

            container.appendChild(btn);
        });
    }

    let timerSalvar;
    function salvarNomeDelay() {
        clearTimeout(timerSalvar);
        timerSalvar = setTimeout(async () => {
            const novoNome = document.getElementById('perfil-nome-input').value.trim();
            if (novoNome === "") return;
            jogador.nome = novoNome;
            await banco.from('ranking').update({ nome: novoNome }).eq('user_id', jogador.id);
            document.getElementById('home-nome').innerText = novoNome;
            mostrarToast("Nome salvo!", "success");
        }, 1500);
    }

    function mudarAba(idTela, element) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(idTela).classList.add('active');
        
        if (element) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            element.classList.add('active');
        }

        if (idTela === 'tela-home' || idTela === 'tela-perfil' || idTela === 'tela-loja') atualizarDashboard();
    }

    window.onload = () => {
        banco.auth.onAuthStateChange((event, session) => {
            if (session) {
                jogador.id = session.user.id;
                document.getElementById('tela-auth').classList.remove('active');
                document.getElementById('bottom-nav').style.display = 'flex';
                mudarAba('tela-home');
            }
        });
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script></body>
</html>
