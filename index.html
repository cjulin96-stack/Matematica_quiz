<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matemática Quiz - Modo Infinito</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --azul: #4a90e2;
            --azul-escuro: #357abd;
            --verde: #2ecc71;
            --verde-escuro: #27ae60;
            --vermelho: #e74c3c;
            --vermelho-escuro: #c0392b;
            --cinza: #95a5a6;
            --cinza-escuro: #7f8c8d;
            --laranja: #f39c12;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            margin: 0; 
            padding: 20px; 
            text-align: center; 
            color: #333;
            min-height: 100vh;
        }

        .container { 
            max-width: 500px; 
            margin: auto; 
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
        }

        h1 { color: #2c3e50; font-size: 28px; margin-bottom: 20px; font-weight: 900; }
        h2 { color: #2c3e50; font-weight: 900; }
        
        .header-buttons { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
        
        /* Botões estilo 3D */
        button { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer; border: none; border-radius: 12px; transition: all 0.1s; }
        
        .btn-login { background-color: #db4437; color: white; padding: 10px 15px; box-shadow: 0 4px 0 #b73227; opacity: 0.8; }
        .btn-ranking { background-color: var(--laranja); color: white; padding: 10px 15px; box-shadow: 0 4px 0 #c87f0a; }
        .btn-ranking:active { transform: translateY(4px); box-shadow: 0 0 0 #c87f0a; }
        
        .btn-principal { 
            color: white; 
            padding: 15px 20px; 
            width: 100%; 
            margin-top: 10px; 
            font-size: 18px; 
            display: block; /* CORRIGIDO AQUI */
        }
        .btn-verde { background-color: var(--verde); box-shadow: 0 5px 0 var(--verde-escuro); }
        .btn-verde:active { transform: translateY(5px); box-shadow: 0 0 0 var(--verde-escuro); }
        
        .btn-azul { background-color: var(--azul); box-shadow: 0 5px 0 var(--azul-escuro); }
        .btn-azul:active { transform: translateY(5px); box-shadow: 0 0 0 var(--azul-escuro); }

        .btn-vermelho { background-color: var(--vermelho); box-shadow: 0 5px 0 var(--vermelho-escuro); }
        .btn-vermelho:active { transform: translateY(5px); box-shadow: 0 0 0 var(--vermelho-escuro); }

        .btn-cinza { background-color: var(--cinza); box-shadow: 0 5px 0 var(--cinza-escuro); }
        .btn-cinza:active { transform: translateY(5px); box-shadow: 0 0 0 var(--cinza-escuro); }
        
        input[type="text"], select { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 2px solid #dfe6e9; 
            border-radius: 12px; 
            font-size: 16px; 
            font-family: 'Nunito', sans-serif;
            background-color: #f8f9fa; 
            transition: 0.3s;
        }
        input[type="text"]:focus, select:focus { border-color: var(--azul); outline: none; background-color: #fff;}
        
        .quiz-card { background: #f8f9fa; padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 2px solid #e9ecef; }
        .pergunta { font-size: 22px; font-weight: 900; margin-bottom: 20px; color: #2c3e50; }
        
        .opcao { 
            display: block; 
            width: 100%; 
            background: white; 
            border: 2px solid #ced6e0; 
            padding: 15px; 
            margin-bottom: 12px; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: 700;
            color: #57606f;
            transition: all 0.2s; 
        }
        .opcao:hover { border-color: var(--azul); color: var(--azul); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.05);}
        
        .correta { background: var(--verde) !important; color: white !important; border-color: var(--verde-escuro) !important; animation: pop 0.3s ease; }
        .errada { background: var(--vermelho) !important; color: white !important; border-color: var(--vermelho-escuro) !important; animation: shake 0.3s ease; }
        
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

        .resultado { display: none; text-align: center; }
        .ranking-lista { text-align: left; margin-top: 20px; background: #f8f9fa; border-radius: 16px; padding: 10px; }
        .ranking-item { padding: 12px 15px; border-bottom: 1px solid #e9ecef; display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; color: #2f3542; }
        .ranking-item:last-child { border-bottom: none; }
        .ranking-item:nth-child(1) { background: #fff3cd; border-radius: 10px 10px 0 0; color: #856404; }
        .ranking-item:nth-child(2) { background: #e2e3e5; color: #383d41;}
        .ranking-item:nth-child(3) { background: #f8d7da; color: #721c24;}
        
        .pontuacao-viva { font-size: 20px; font-weight: 900; color: var(--azul); margin-bottom: 15px; background: #e3f2fd; padding: 10px; border-radius: 10px; }
        .feedback { font-size: 18px; font-weight: 900; min-height: 30px; margin-top: 15px; transition: 0.3s; }
        .btn-trocar { background: none; border: none; color: #a4b0be; text-decoration: underline; cursor: pointer; margin-top: 20px; font-size: 14px; box-shadow: none;}
    </style>
</head>
<body>

<div class="container">
    <h1>🧮 Matemática Quiz</h1>
    
    <div class="header-buttons">
        <button class="btn-login" onclick="alert('O login com Google será ativado em breve!')">Entrar com Google</button>
        <button class="btn-ranking" onclick="abrirRanking()">🏆 Ranking</button>
    </div>

    <div id="tela-inicio">
        <p style="color: #57606f; margin-bottom: 20px;">Escolha o nível e jogue o <strong>Modo Infinito</strong>!<br>As perguntas nunca acabam. Pare quando quiser!</p>
        <input type="text" id="nome-aluno" placeholder="Digite seu nome" oninput="salvarPerfilRapido()">
        
        <select id="nivel-aluno" onchange="salvarPerfilRapido()">
            <option value="5">5º Ano</option>
            <option value="6">6º Ano</option>
            <option value="7">7º Ano</option>
            <option value="8">8º Ano</option>
            <option value="9">9º Ano</option>
        </select>

        <button class="btn-principal btn-verde" onclick="iniciarQuiz()">Começar Modo Infinito 🚀</button>
    </div>

    <div id="tela-quiz" style="display: none;">
        <div class="pontuacao-viva" id="placar-vivo">Pontos da Rodada: 0</div>
        <div class="quiz-card">
            <div class="pergunta" id="texto-pergunta">Carregando pergunta...</div>
            <div id="opcoes-container"></div>
            <div id="feedback-text" class="feedback"></div>
        </div>
        <div class="controles">
            <button class="btn-principal btn-azul" id="btn-proximo" style="display: none;" onclick="proximaPergunta()">Próxima ➡️</button>
            <button class="btn-principal btn-vermelho" onclick="mostrarResultado()">Parar e Salvar 🏁</button>
        </div>
        <button class="btn-trocar" onclick="trocarJogador()">Trocar de Jogador</button>
    </div>

    <div id="tela-resultado" class="resultado">
        <h2>Fim da Rodada! 🎉</h2>
        <p style="font-size: 18px;">Você fez <strong id="pontuacao-final" style="color: var(--azul); font-size: 24px;">0</strong> pontos nesta rodada.</p>
        <p id="status-salvamento" style="font-size: 16px; font-weight: bold; color: #7f8c8d; margin-bottom: 20px;"></p>
        <button class="btn-principal btn-verde" onclick="abrirRanking()">Ver Ranking 🏆</button>
        <button class="btn-principal btn-cinza" style="margin-top: 15px;" onclick="jogarNovamente()">Jogar de Novo 🔄</button>
        <button class="btn-trocar" onclick="trocarJogador()">Trocar de Jogador</button>
    </div>

    <div id="tela-ranking" style="display: none;">
        <h2>🏆 Top 10 Ranking</h2>
        <div class="ranking-lista" id="lista-ranking">
            <p style="padding: 15px; text-align: center;">Carregando ranking...</p>
        </div>
        <button class="btn-principal btn-azul" style="margin-top: 20px;" onclick="voltarAoJogo()">Voltar ao Quiz</button>
    </div>
</div>

<script>
    const supabaseUrl = 'https://yrylpxrqflhuwmgvfyat.supabase.co';
    const supabaseKey = 'sb_publishable_ytcMgi4QgIkfQPlT_7a5fQ_PyuODEwD';
    const banco = supabase.createClient(supabaseUrl, supabaseKey);

    let perguntas = [];
    let indiceAtual = 0;
    let pontuacao = 0;
    let combo = 0;
    let nomeDoAluno = "";
    let nivelAluno = "5";
    let jogoEmAndamento = false;

    const mensagensAcerto = [
        "Parabéns, você acertou! 🎉",
        "Isso aí! Mandou muito bem! 🌟",
        "Acertou de novo! Você é fera! 🦁",
        "Uau, melhor que professor! 👨‍🏫",
        "Cálculo perfeito! Imparável! 🚀",
        "Você está voando! 💯",
        "Gênio da matemática! 🧠"
    ];

    const mensagensErro = [
        "Ops, não foi dessa vez. Tente a próxima!",
        "Quase! A resposta certa está em verde.",
        "Não desanime, continue tentando! 💪",
        "Errou, mas todo mundo erra. Bora pra cima!",
        "Cuidado com as continhas! Você consegue!"
    ];

    function salvarPerfilRapido() {
        const nome = document.getElementById('nome-aluno').value.trim();
        const nivel = document.getElementById('nivel-aluno').value;
        if(nome !== "") {
            localStorage.setItem('quizPerfil', JSON.stringify({ nome: nome, nivel: nivel }));
        }
    }

    window.onload = function() {
        const perfilSalvo = localStorage.getItem('quizPerfil');
        if (perfilSalvo) {
            const perfil = JSON.parse(perfilSalvo);
            document.getElementById('nome-aluno').value = perfil.nome;
            document.getElementById('nivel-aluno').value = perfil.nivel;
            nomeDoAluno = perfil.nome;
            nivelAluno = perfil.nivel;
        }
    };

    function gerarQuestaoAleatoria(nivel) {
        let pergunta, respostaCorreta;
        
        if (nivel === '5') {
            const isSoma = Math.random() > 0.5;
            const a = Math.floor(Math.random() * 50) + 10;
            const b = Math.floor(Math.random() * 40) + 10;
            if (isSoma) { pergunta = `Quanto é ${a} + ${b}?`; respostaCorreta = a + b; } 
            else { const maior = Math.max(a, b); const menor = Math.min(a, b); pergunta = `Quanto é ${maior} - ${menor}?`; respostaCorreta = maior - menor; }
        } else if (nivel === '6') {
            const isMult = Math.random() > 0.5;
            const a = Math.floor(Math.random() * 10) + 2;
            const b = Math.floor(Math.random() * 10) + 2;
            if (isMult) { pergunta = `Quanto é ${a} x ${b}?`; respostaCorreta = a * b; } 
            else { pergunta = `Quanto é ${a * b} ÷ ${a}?`; respostaCorreta = b; }
        } else if (nivel === '7') {
            const x = Math.floor(Math.random() * 10) + 1;
            const a = Math.floor(Math.random() * 10) + 1;
            const b = x + a;
            pergunta = `Se x + ${a} = ${b}, qual o valor de x?`;
            respostaCorreta = x;
        } else if (nivel === '8') {
            const a = Math.floor(Math.random() * 10) + 2;
            pergunta = `Quanto é ${a}²?`;
            respostaCorreta = a * a;
        } else if (nivel === '9') {
            const a = Math.floor(Math.random() * 5) + 1;
            const b = Math.floor(Math.random() * 10);
            const x = Math.floor(Math.random() * 5) + 1;
            pergunta = `Na função f(x) = ${a}x + ${b}, qual o valor de f(${x})?`;
            respostaCorreta = a * x + b;
        }

        const opcoesSet = new Set([respostaCorreta]);
        while (opcoesSet.size < 4) {
            const erro = respostaCorreta + (Math.floor(Math.random() * 10) - 5);
            if (erro !== respostaCorreta && erro >= 0) { opcoesSet.add(erro); }
        }
        
        let opcoes = Array.from(opcoesSet).sort(() => Math.random() - 0.5).map(String);
        let indexCorreta = opcoes.indexOf(String(respostaCorreta));

        return { pergunta: pergunta, opcoes: opcoes, correta: indexCorreta };
    }

    function iniciarQuiz() {
        nomeDoAluno = document.getElementById('nome-aluno').value.trim();
        nivelAluno = document.getElementById('nivel-aluno').value;
        
        if (nomeDoAluno === "") {
            alert("Por favor, digite seu nome primeiro!");
            return;
        }
        
        indiceAtual = 0;
        pontuacao = 0;
        combo = 0;
        perguntas = []; 
        jogoEmAndamento = true;
        
        salvarPerfilRapido(); 
        
        document.getElementById('tela-inicio').style.display = 'none';
        document.getElementById('tela-resultado').style.display = 'none';
        document.getElementById('tela-ranking').style.display = 'none';
        document.getElementById('tela-quiz').style.display = 'block';
        
        carregarPergunta();
    }

    function carregarPergunta() {
        if (indiceAtual >= perguntas.length) {
            for(let i=0; i<5; i++) {
                perguntas.push(gerarQuestaoAleatoria(nivelAluno));
            }
        }

        document.getElementById('placar-vivo').innerText = `Pontos da Rodada: ${pontuacao}`;
        document.getElementById('feedback-text').innerText = "";
        const container = document.getElementById('opcoes-container');
        container.innerHTML = ''; 
        document.getElementById('btn-proximo').style.display = 'none'; // Esconde o botão próxima

        const perguntaAtual = perguntas[indiceAtual];
        document.getElementById('texto-pergunta').innerText = perguntaAtual.pergunta;

        perguntaAtual.opcoes.forEach((opcao, index) => {
            const botao = document.createElement('button');
            botao.innerText = opcao;
            botao.classList.add('opcao');
            botao.onclick = () => verificarResposta(index, botao);
            container.appendChild(botao);
        });
    }

    function verificarResposta(indexEscolhido, botaoClicado) {
        const perguntaAtual = perguntas[indiceAtual];
        const todosBotoes = document.querySelectorAll('.opcao');
        const feedback = document.getElementById('feedback-text');
        todosBotoes.forEach(btn => btn.disabled = true);

        if (indexEscolhido === perguntaAtual.correta) {
            botaoClicado.classList.add('correta');
            pontuacao += 10;
            combo++;
            
            if (combo >= 3) {
                const msgIndex = Math.floor(Math.random() * (mensagensAcerto.length - 3)) + 3;
                feedback.innerText = mensagensAcerto[msgIndex];
            } else {
                feedback.innerText = mensagensAcerto[Math.floor(Math.random() * 3)];
            }
            feedback.style.color = "var(--verde-escuro)";

        } else {
            botaoClicado.classList.add('errada');
            todosBotoes[perguntaAtual.correta].classList.add('correta');
            pontuacao = Math.max(0, pontuacao - 4);
            combo = 0;
            feedback.innerText = mensagensErro[Math.floor(Math.random() * mensagensErro.length)];
            feedback.style.color = "var(--vermelho-escuro)";
        }

        document.getElementById('placar-vivo').innerText = `Pontos da Rodada: ${pontuacao}`;
        document.getElementById('btn-proximo').style.display = 'block'; // Mostra o botão próxima
    }

    function proximaPergunta() {
        indiceAtual++;
        carregarPergunta();
    }

    async function mostrarResultado() {
        if(pontuacao === 0 && !confirm("Você ainda não fez nenhum ponto. Deseja realmente parar?")) return;

        jogoEmAndamento = false;
        document.getElementById('tela-quiz').style.display = 'none';
        document.getElementById('tela-resultado').style.display = 'block';
        document.getElementById('pontuacao-final').innerText = pontuacao;
        
        const status = document.getElementById('status-salvamento');
        status.innerText = "Verificando pontuação...";
        status.style.color = "var(--laranja)";

        const nivelTexto = nivelAluno + "º Ano";

        try {
            const { data: existentes, error: erroBusca } = await banco
                .from('ranking')
                .select('id, pontuacao')
                .eq('nome', nomeDoAluno)
                .eq('nivel', nivelTexto)
                .order('pontuacao', { ascending: false })
                .limit(1);

            if (erroBusca) throw new Error("Erro na busca: " + erroBusca.message);

            const existente = (existentes && existentes.length > 0) ? existentes[0] : null;

            if (existente) {
                const novaPontuacaoTotal = Math.max(0, existente.pontuacao + pontuacao);
                const { error: erroUpdate } = await banco
                    .from('ranking')
                    .update({ pontuacao: novaPontuacaoTotal })
                    .eq('id', existente.id);
                
                if (erroUpdate) throw new Error("Erro no update: " + erroUpdate.message);

                status.innerText = `Você somou ${pontuacao > 0 ? '+' : ''}${pontuacao} pts! Seu total agora é ${novaPontuacaoTotal} pts! 🚀`;
                status.style.color = "var(--verde-escuro)";
            } else {
                const pontosIniciais = Math.max(0, pontuacao);
                const { error: erroInsert } = await banco
                    .from('ranking')
                    .insert([{ nome: nomeDoAluno, pontuacao: pontosIniciais, nivel: nivelTexto }]);
                
                if (erroInsert) throw new Error("Erro no insert: " + erroInsert.message);

                status.innerText = "Pontuação inicial salva no ranking!";
                status.style.color = "var(--verde-escuro)";
            }
        } catch (erro) {
            console.error(erro);
            status.innerText = "Erro ao salvar no ranking. Verifique a conexão.";
            status.style.color = "var(--vermelho-escuro)";
        }
    }

    async function abrirRanking() {
        document.getElementById('tela-inicio').style.display = 'none';
        document.getElementById('tela-quiz').style.display = 'none';
        document.getElementById('tela-resultado').style.display = 'none';
        document.getElementById('tela-ranking').style.display = 'block';

        const lista = document.getElementById('lista-ranking');
        lista.innerHTML = '<p style="padding: 15px; text-align: center;">Carregando ranking...</p>';

        const { data, error } = await banco
            .from('ranking')
            .select('nome, pontuacao, nivel')
            .order('pontuacao', { ascending: false })
            .order('nome', { ascending: true })
            .limit(10);

        if (error) {
            lista.innerHTML = '<p style="padding: 15px; text-align: center;">Erro ao carregar o ranking.</p>';
            return;
        }

        if (data.length === 0) {
            lista.innerHTML = '<p style="padding: 15px; text-align: center;">Ninguém jogou ainda. Seja o primeiro!</p>';
            return;
        }

        lista.innerHTML = '';
