<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matemática Quiz - Modo Infinito</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 24px; }
        .header-buttons { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn-login { background-color: #db4437; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; opacity: 0.6; }
        .btn-ranking { background-color: #f39c12; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .quiz-card { background: #e8f4f8; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .pergunta { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .opcao { display: block; width: 100%; background: white; border: 2px solid #bdc3c7; padding: 12px; margin-bottom: 10px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; box-sizing: border-box;}
        .opcao:hover { background: #ecf0f1; border-color: #3498db; }
        .correta { background: #2ecc71 !important; color: white; border-color: #27ae60 !important; }
        .errada { background: #e74c3c !important; color: white; border-color: #c0392b !important; }
        .controles { margin-top: 20px; display: flex; flex-direction: column; gap: 10px;}
        .btn-principal { background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: none; width: 100%; box-sizing: border-box;}
        .btn-verde { background: #2ecc71; }
        .btn-vermelho { background: #e74c3c; display: block; }
        
        input[type="text"], select { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: white; appearance: none; -webkit-appearance: none; }
        
        .resultado { display: none; text-align: center; }
        .ranking-lista { text-align: left; margin-top: 20px; }
        .ranking-item { background: #f8f9fa; padding: 10px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; font-size: 16px; }
        .ranking-item:nth-child(1) { background: #ffeaa7; font-weight: bold; }
        .ranking-item:nth-child(2) { background: #dfe6e9; font-weight: bold; }
        .ranking-item:nth-child(3) { background: #fab1a0; font-weight: bold; }
        .pontuacao-viva { font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
        .feedback { font-size: 18px; font-weight: bold; min-height: 30px; margin-top: 15px; transition: 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧮 Matemática Quiz</h1>
    
    <div class="header-buttons">
        <button class="btn-login" onclick="alert('O login com Google será ativado em breve!')">Entrar com Google</button>
        <button class="btn-ranking" onclick="abrirRanking()">🏆 Ranking</button>
    </div>

    <div id="tela-inicio">
        <p>Escolha o nível e jogue o <strong>Modo Infinito</strong>!<br>As perguntas nunca acabam. Pare quando quiser!</p>
        <input type="text" id="nome-aluno" placeholder="Digite seu nome" oninput="salvarPerfilRapido()">
        
        <select id="nivel-aluno" onchange="salvarPerfilRapido()">
            <option value="5">5º Ano</option>
            <option value="6">6º Ano</option>
            <option value="7">7º Ano</option>
            <option value="8">8º Ano</option>
            <option value="9">9º Ano</option>
        </select>

        <button class="btn-principal btn-verde" style="display:block; margin: 0 auto;" onclick="iniciarQuiz()">Começar Modo Infinito 🚀</button>
    </div>

    <div id="tela-quiz" style="display: none;">
        <div class="pontuacao-viva" id="placar-vivo">Pontos da Rodada: 0</div>
        <div class="quiz-card">
            <div class="pergunta" id="texto-pergunta">Carregando pergunta...</div>
            <div id="opcoes-container"></div>
            <div id="feedback-text" class="feedback"></div>
        </div>
        <div class="controles">
            <button class="btn-principal" id="btn-proximo" onclick="proximaPergunta()">Próxima ➡️</button>
            <button class="btn-principal btn-vermelho" onclick="mostrarResultado()">Parar e Salvar 🏁</button>
        </div>
    </div>

    <div id="tela-resultado" class="resultado">
        <h2>Fim da Rodada! 🎉</h2>
        <p>Você fez <strong id="pontuacao-final">0</strong> pontos nesta rodada.</p>
        <p id="status-salvamento" style="font-size: 16px; font-weight: bold; color: #7f8c8d; margin-bottom: 15px;"></p>
        <button class="btn-principal btn-verde" style="display:block; margin: 10px auto;" onclick="abrirRanking()">Ver Ranking</button>
        <button class="btn-principal" style="display:block; margin: 0 auto; background:#95a5a6;" onclick="reiniciarTudo()">Jogar de Novo</button>
    </div>

    <div id="tela-ranking" style="display: none;">
        <h2>🏆 Top 10 Ranking (XP Total)</h2>
        <div class="ranking-lista" id="lista-ranking">
            <p>Carregando ranking...</p>
        </div>
        <button class="btn-principal" style="display:block; margin: 20px auto 0; background:#3498db;" onclick="voltarAoJogo()">Voltar</button>
    </div>
</div>

<script>
    const supabaseUrl = 'https://yrylpxrqflhuwmgvfyat.supabase.co';
    const supabaseKey = 'sb_publishable_ytcMgi4QgIkfQPlT_7a5fQ_PyuODEwD';
    const banco = supabase.createClient(supabaseUrl, supabaseKey);

    let perguntas = [];
    let indiceAtual = 0;
    let pontuacao = 0;
    let combo = 0;
    let nomeDoAluno = "";
    let nivelAluno = "5";

    const mensagensAcerto = [
        "Parabéns, você acertou! 🎉",
        "Isso aí! Mandou muito bem! 🌟",
        "Acertou de novo! Você é fera! 🦁",
        "Uau, melhor que professor! 👨‍🏫",
        "Cálculo perfeito! Imparável! 🚀",
        "Você está voando! 💯",
        "Gênio da matemática! 🧠"
    ];

    const mensagensErro = [
        "Ops, não foi dessa vez. Tente a próxima!",
        "Quase! A resposta certa está em verde.",
        "Não desanime, continue tentando! 💪",
        "Errou, mas todo mundo erra. Bora pra cima!",
        "Cuidado com as continhas! Você consegue!"
    ];

    function salvarPerfilRapido() {
        const nome = document.getElementById('nome-aluno').value.trim();
        const nivel = document.getElementById('nivel-aluno').value;
        if(nome !== "") {
            localStorage.setItem('quizPerfil', JSON.stringify({ nome: nome, nivel: nivel }));
        }
    }

    window.onload = function() {
        const perfilSalvo = localStorage.getItem('quizPerfil');
        if (perfilSalvo) {
            const perfil = JSON.parse(perfilSalvo);
            document.getElementById('nome-aluno').value = perfil.nome;
            document.getElementById('nivel-aluno').value = perfil.nivel;
        }
    };

    function gerarQuestaoAleatoria(nivel) {
        let pergunta, respostaCorreta;
        
        if (nivel === '5') {
            const isSoma = Math.random() > 0.5;
            const a = Math.floor(Math.random() * 50) + 10;
            const b = Math.floor(Math.random() * 40) + 10;
            if (isSoma) { pergunta = `Quanto é ${a} + ${b}?`; respostaCorreta = a + b; } 
            else { const maior = Math.max(a, b); const menor = Math.min(a, b); pergunta = `Quanto é ${maior} - ${menor}?`; respostaCorreta = maior - menor; }
        } else if (nivel === '6') {
            const isMult = Math.random() > 0.5;
            const a = Math.floor(Math.random() * 10) + 2;
            const b = Math.floor(Math.random() * 10) + 2;
            if (isMult) { pergunta = `Quanto é ${a} x ${b}?`; respostaCorreta = a * b; } 
            else { pergunta = `Quanto é ${a * b} ÷ ${a}?`; respostaCorreta = b; }
        } else if (nivel === '7') {
            const x = Math.floor(Math.random() * 10) + 1;
            const a = Math.floor(Math.random() * 10) + 1;
            const b = x + a;
            pergunta = `Se x + ${a} = ${b}, qual o valor de x?`;
            respostaCorreta = x;
        } else if (nivel === '8') {
            const a = Math.floor(Math.random() * 10) + 2;
            pergunta = `Quanto é ${a}²?`;
            respostaCorreta = a * a;
        } else if (nivel === '9') {
            const a = Math.floor(Math.random() * 5) + 1;
            const b = Math.floor(Math.random() * 10);
            const x = Math.floor(Math.random() * 5) + 1;
            pergunta = `Na função f(x) = ${a}x + ${b}, qual o valor de f(${x})?`;
            respostaCorreta = a * x + b;
        }

        const opcoesSet = new Set([respostaCorreta]);
        while (opcoesSet.size < 4) {
            const erro = respostaCorreta + (Math.floor(Math.random() * 10) - 5);
            if (erro !== respostaCorreta && erro >= 0) { opcoesSet.add(erro); }
        }
        
        let opcoes = Array.from(opcoesSet).sort(() => Math.random() - 0.5).map(String);
        let indexCorreta = opcoes.indexOf(String(respostaCorreta));

        return { pergunta: pergunta, opcoes: opcoes, correta: indexCorreta };
    }

    function iniciarQuiz() {
        nomeDoAluno = document.getElementById('nome-aluno').value.trim();
        nivelAluno = document.getElementById('nivel-aluno').value;
        
        if (nomeDoAluno === "") {
            alert("Por favor, digite seu nome primeiro!");
            return;
        }
        
        indiceAtual = 0;
        pontuacao = 0;
        combo = 0;
        perguntas = []; 
        
        salvarPerfilRapido(); 
        
        document.getElementById('tela-inicio').style.display = 'none';
        document.getElementById('tela-quiz').style.display = 'block';
        
        carregarPergunta();
    }

    function carregarPergunta() {
        if (indiceAtual >= perguntas.length) {
            for(let i=0; i<5; i++) {
                perguntas.push(gerarQuestaoAleatoria(nivelAluno));
            }
        }

        document.getElementById('placar-vivo').innerText = `Pontos da Rodada: ${pontuacao}`;
        document.getElementById('feedback-text').innerText = "";
        const container = document.getElementById('opcoes-container');
        container.innerHTML = ''; 
        document.getElementById('btn-proximo').style.display = 'none';

        const perguntaAtual = perguntas[indiceAtual];
        document.getElementById('texto-pergunta').innerText = perguntaAtual.pergunta;

        perguntaAtual.opcoes.forEach((opcao, index) => {
            const botao = document.createElement('button');
            botao.innerText = opcao;
            botao.classList.add('opcao');
            botao.onclick = () => verificarResposta(index, botao);
            container.appendChild(botao);
        });
    }

    function verificarResposta(indexEscolhido, botaoClicado) {
        const perguntaAtual = perguntas[indiceAtual];
        const todosBotoes = document.querySelectorAll('.opcao');
        const feedback = document.getElementById('feedback-text');
        todosBotoes.forEach(btn => btn.disabled = true);

        if (indexEscolhido === perguntaAtual.correta) {
            botaoClicado.classList.add('correta');
            pontuacao += 10;
            combo++;
            
            if (combo >= 3) {
                const msgIndex = Math.floor(Math.random() * (mensagensAcerto.length - 3)) + 3;
                feedback.innerText = mensagensAcerto[msgIndex];
            } else {
                feedback.innerText = mensagensAcerto[Math.floor(Math.random() * 3)];
            }
            feedback.style.color = "#2ecc71";

        } else {
            botaoClicado.classList.add('errada');
            todosBotoes[perguntaAtual.correta].classList.add('correta');
            pontuacao = Math.max(0, pontuacao - 4);
            combo = 0;
            feedback.innerText = mensagensErro[Math.floor(Math.random() * mensagensErro.length)];
            feedback.style.color = "#e74c3c";
        }

        document.getElementById('placar-vivo').innerText = `Pontos da Rodada: ${pontuacao}`;
        document.getElementById('btn-proximo').style.display = 'block';
    }

    function proximaPergunta() {
        indiceAtual++;
        carregarPergunta();
    }

    async function mostrarResultado() {
        if(pontuacao === 0 && !confirm("Você ainda não fez nenhum ponto. Deseja realmente parar?")) return;

        document.getElementById('tela-quiz').style.display = 'none';
        document.getElementById('tela-resultado').style.display = 'block';
        document.getElementById('pontuacao-final').innerText = pontuacao;
        
        const status = document.getElementById('status-salvamento');
        status.innerText = "Verificando pontuação...";
        status.style.color = "#f39c12";

        const nivelTexto = nivelAluno + "º Ano";

        try {
            const { data: existentes, error: erroBusca } = await banco
                .from('ranking')
                .select('id, pontuacao')
                .eq('nome', nomeDoAluno)
                .eq('nivel', nivelTexto)
                .order('pontuacao', { ascending: false })
                .limit(1);

            if (erroBusca) throw new Error("Erro na busca: " + erroBusca.message);

            const existente = (existentes && existentes.length > 0) ? existentes[0] : null;

            if (existente) {
                const novaPontuacaoTotal = Math.max(0, existente.pontuacao + pontuacao);
                const { error: erroUpdate } = await banco
                    .from('ranking')
                    .update({ pontuacao: novaPontuacaoTotal })
                    .eq('id', existente.id);
                
                if (erroUpdate) throw new Error("Erro no update: " + erroUpdate.message);

                status.innerText = `Você somou ${pontuacao > 0 ? '+' : ''}${pontuacao} pts! Seu total agora é ${novaPontuacaoTotal} pts! 🚀`;
                status.style.color = "#2ecc71";
            } else {
                const pontosIniciais = Math.max(0, pontuacao);
                const { error: erroInsert } = await banco
                    .from('ranking')
                    .insert([{ nome: nomeDoAluno, pontuacao: pontosIniciais, nivel: nivelTexto }]);
                
                if (erroInsert) throw new Error("Erro no insert: " + erroInsert.message);

                status.innerText = "Pontuação inicial salva no ranking!";
                status.style.color = "#2ecc71";
            }
        } catch (erro) {
            console.error(erro);
            status.innerText = "Erro ao salvar no ranking. Verifique a conexão.";
            status.style.color = "#e74c3c";
        }
    }

    async function abrirRanking() {
        document.getElementById('tela-inicio').style.display = 'none';
        document.getElementById('tela-quiz').style.display = 'none';
        document.getElementById('tela-resultado').style.display = 'none';
        document.getElementById('tela-ranking').style.display = 'block';

        const lista = document.getElementById('lista-ranking');
        lista.innerHTML = '<p>Carregando ranking...</p>';

        const { data, error } = await banco
            .from('ranking')
            .select('nome, pontuacao, nivel')
            .order('pontuacao', { ascending: false })
            .order('nome', { ascending: true })
            .limit(10);

        if (error) {
            lista.innerHTML = '<p>Erro ao carregar o ranking.</p>';
            return;
        }

        if (data.length === 0) {
            lista.innerHTML = '<p>Ninguém jogou ainda. Seja o primeiro!</p>';
            return;
        }

        lista.innerHTML = '';
        data.forEach((aluno, index) => {
            const item = document.createElement('div');
            item.classList.add('ranking-item');
            const ano = aluno.nivel ? `(${aluno.nivel})` : '';
            item.innerHTML = `<span>${index + 1}º ${aluno.nome} ${ano}</span> <span>${aluno.pontuacao} pts</span>`;
            lista.appendChild(item);
        });
    }

    function voltarAoJogo() {
        document.getElementById('tela-ranking').style.display = 'none';
        document.getElementById('tela-inicio').style.display = 'block';
        if(nomeDoAluno) {
            document.getElementById('nome-aluno').value = nomeDoAluno;
            document.getElementById('nivel-aluno').value = nivelAluno;
        }
    }

    function reiniciarTudo() {
        document.getElementById('tela-resultado').style.display = 'none';
        document.getElementById('tela-inicio').style.display = 'block';
        if(nomeDoAluno) {
            document.getElementById('nome-aluno').value = nomeDoAluno;
            document.getElementById('nivel-aluno').value = nivelAluno;
        }
    }
</script>

</body>
</html>
